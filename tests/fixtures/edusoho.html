<!DOCTYPE html>
<html>
<head><title>EduSoho 原生 radio</title></head>
<body>
<div class="ibs-engine-item">
  <div class="answer-mode-tag">单选题</div>
  <div class="ibs-stem">1 + 1 = ?</div>
  <label class="ibs-choose-item"><input type="radio"> <span>A. 2</span></label>
  <label class="ibs-choose-item"><input type="radio"> <span>B. 3</span></label>
  <label class="ibs-choose-item"><input type="radio"> <span>C. 11</span></label>
</div>
<div class="ibs-engine-item">
  <div class="answer-mode-tag">多选题</div>
  <div class="ibs-stem">下列哪些是水果？</div>
  <label class="ibs-choose-item"><input type="checkbox"> <span>A. 苹果</span></label>
  <label class="ibs-choose-item"><input type="checkbox"> <span>B. 萝卜</span></label>
  <label class="ibs-choose-item"><input type="checkbox"> <span>C. 香蕉</span></label>
</div>
</body>
</html>
