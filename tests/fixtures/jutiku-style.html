<!DOCTYPE html>
<html>
<head><title>英语测试（自绘 A/B/C/D 选项，无站点 class）</title></head>
<body>
<div id="paper">
  <h2>TEST YOUR ENGLISH</h2>

  <p>1. She ___ to school every day.</p>
  <div>A. go</div>
  <div>B. goes</div>
  <div>C. going</div>
  <div>D. gone</div>

  <p>2. They ___ playing football now.</p>
  <div>A. is</div>
  <div>B. am</div>
  <div>C. are</div>
  <div>D. be</div>

  <p>3. He ___ a book yesterday.</p>
  <div>A. read</div>
  <div>B. reads</div>
  <div>C. reading</div>
  <div>D. will read</div>
</div>
</body>
</html>
