<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>混合卷：单选+多选+主观+论述</title></head>
<body>
<div class="paper">
  <h3>一、单选题</h3>
  <div class="qwrap">
    <p>1. She ___ to school every day.</p>
    <p><i>A</i><span>go</span></p>
    <p><i>B</i><span>goes</span></p>
    <p><i>C</i><span>going</span></p>
    <p><i>D</i><span>gone</span></p>
  </div>
  <div class="qwrap">
    <p>2. They ___ playing football now.</p>
    <p><i>A</i><span>is</span></p>
    <p><i>B</i><span>am</span></p>
    <p><i>C</i><span>are</span></p>
    <p><i>D</i><span>be</span></p>
  </div>
  <h3>二、多选题</h3>
  <div class="qwrap">
    <p>3. Which of the following are fruits?</p>
    <p><i>A</i><span>apple</span></p>
    <p><i>B</i><span>banana</span></p>
    <p><i>C</i><span>carrot</span></p>
    <p><i>D</i><span>cherry</span></p>
  </div>
  <h3>三、主观题</h3>
  <div class="qwrap">
    <p>4. 请简述什么是光合作用。</p>
    <div class="ans" contenteditable="true"></div>
  </div>
  <div class="qwrap">
    <p>5. 举例说明什么是惯性。</p>
    <div class="ans" contenteditable="true"></div>
  </div>
  <h3>四、论述题</h3>
  <div class="qwrap">
    <p>6. 论述人工智能对教育的影响。</p>
    <textarea class="essay"></textarea>
  </div>
</div>
</body>
</html>
