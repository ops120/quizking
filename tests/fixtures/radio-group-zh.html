<!DOCTYPE html>
<html>
<head><title>radio name 分组（中文选项，无字母标记）</title></head>
<body>
<form id="quizForm">
  <div class="qwrap">
    <p>第一题：下面哪个是动物？</p>
    <div><input type="radio" name="q1"> 猫</div>
    <div><input type="radio" name="q1"> 狗</div>
  </div>
  <div class="qwrap">
    <p>第二题：下面哪个是颜色？</p>
    <div><input type="radio" name="q2"> 红</div>
    <div><input type="radio" name="q2"> 蓝</div>
  </div>
</form>
</body>
</html>
